schema: spec-driven

context: |
  Language: zh
  All artifacts must be written in zh.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: flow-forge — learning clone of Dify-style Workflow (not REPL agent).
  Stack: api/ Flask+Pydantic+uv+SQLite; web/ Next later (placeholder only in bootstrap).
  Layers: controllers → services → core (Dify-like names, subset only).
  Graph: Dify draft field subset compatibility; first nodes Start/Template/End.
  Runs: sync execution + persisted events; poll-ready run_id APIs; no auth/tenancy.
  Process: unified-dev-workflow; blogs in docs/blog/; see CONTEXT.md.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
