schema: spec-driven

context: |
  Language: zh
  所有制品正文使用中文。
  OpenSpec 结构标题与 SHALL/MUST 等规范性关键词保持英文。

  项目：flow-forge——对照 Dify 风格 Workflow 的学习向实现（不是 REPL Agent）。
  技术栈：api/ 使用 Flask + Pydantic + uv + SQLite；web/ 后续再上 Next（bootstrap 仅占位）。
  分层：controllers → services → core（对齐 Dify 命名，只建子集）。
  图：与 Dify draft 字段子集兼容；首批节点 Start / Template / End。
  运行：同步执行 + 事件落库；API 以 run_id 支持轮询；无账号/多租户。
  流程：unified-dev-workflow；博文在 docs/blog/；详见 CONTEXT.md。
